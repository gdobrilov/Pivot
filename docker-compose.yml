# docker compose up --build        -> web on http://localhost:3000, API on http://localhost:8080
# docker compose run --rm console  -> prints the challenge output (add moves as arguments)
services:
  api:
    build:
      context: .
      dockerfile: src/RubiksCube.Api/Dockerfile
    image: rubiks-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables /scalar API docs; not needed for the endpoints themselves
      ConnectionStrings__Rubiks: "Data Source=/app/data/rubiks.db"
    volumes:
      - rubiks-data:/app/data               # the SQLite database survives container restarts
    ports:
      - "8080:8080"

  web:
    build:
      context: src/web
    image: rubiks-web
    depends_on:
      - api
    ports:
      - "3000:80"

  console:
    build:
      context: .
      dockerfile: src/RubiksCube.Console/Dockerfile
    image: rubiks-console
    profiles: ["tools"]

volumes:
  rubiks-data:
